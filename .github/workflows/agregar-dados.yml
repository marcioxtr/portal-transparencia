# Atualiza diariamente TUDO o que o app mostra, sem intervenção humana:
# - agregar.py: TCE-SP + SICONFI do ano corrente e anterior (painel)
# - coletar.py: obras, câmara (SAPL), avisos, notícias, licitações, serviços,
#   indicadores — raspados do site oficial e das APIs públicas
# Publica em dados/*.json; o app lê direto do GitHub (raw). Backend de custo zero.
name: Atualizar dados (TCE, SICONFI, site, SAPL)

on:
  schedule:
    - cron: '41 8 * * *' # 05:41 BRT
  workflow_dispatch:
    inputs:
      anos:
        description: 'Anos separados por espaço (vazio = atual e anterior)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  agregar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Agregar
        run: |
          ANOS="${{ github.event.inputs.anos }}"
          if [ -z "$ANOS" ]; then
            ATUAL=$(date +%Y); ANOS="$((ATUAL-1)) $ATUAL"
          fi
          for a in $ANOS; do python3 -I dados/agregar.py "$a"; done
          # cópia embarcada no app (primeiro uso / offline)
          mkdir -p apps/mobile/assets/dados && cp dados/*.json apps/mobile/assets/dados/
      - name: Coletores (obras, câmara, avisos, notícias, licitações, serviços, indicadores)
        continue-on-error: true
        run: python3 -I dados/coletar.py
      - name: Commit se mudou
        run: |
          git config user.name 'agregador-bot'
          git config user.email 'agregador-bot@users.noreply.github.com'
          git add dados/*.json dados/vizinhos-cache/*.json apps/mobile/assets/dados/*.json
          if git diff --cached --quiet; then echo "sem mudanças"; exit 0; fi
          git commit -m "dados: atualização automática $(date -u +%Y-%m-%d)"
          git push
