name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fontes:
    name: packages/fontes — analyze + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/fontes
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test

  mobile:
    name: apps/mobile — analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
