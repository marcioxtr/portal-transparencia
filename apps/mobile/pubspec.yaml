name: transparencia_sjbv
description: >-
  Tô de Olho — transparência na palma da mão. App cidadão, independente e de
  código aberto com os dados públicos de São João da Boa Vista/SP.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.5.0
  flutter_svg: ^2.3.2
  fontes:
    path: ../../packages/fontes
  go_router: ^18.1.3
  intl: ^0.20.0
  latlong2: ^0.10.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo/logo.svg
    - assets/dados/

# Ícones das lojas gerados a partir de assets/logo/*.png (ver docs/brand/).
# Rodar: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/logo/icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/logo/icon_fg.png
